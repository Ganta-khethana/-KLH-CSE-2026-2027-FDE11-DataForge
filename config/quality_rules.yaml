production:
  key_columns: [production_id, event_ts]
  timestamp_column: event_ts
  numeric_ranges:
    quantity: {min: 0, max: 10000}
    cycle_time_sec: {min: 1, max: 600}
  allowed_values:
    shift: [A, B, C]
    status: [RUNNING, STOPPED, IDLE]
  required_columns:
    - production_id
    - line_id
    - machine_id
    - product_code
    - quantity
    - event_ts

sensors:
  key_columns: [sensor_id, event_ts]
  timestamp_column: event_ts
  numeric_ranges:
    temperature_c: {min: 0, max: 120}
    vibration_mms: {min: 0, max: 50}
    pressure_bar: {min: 0, max: 200}
    humidity_pct: {min: 0, max: 100}
  required_columns:
    - sensor_id
    - machine_id
    - temperature_c
    - event_ts

inventory:
  key_columns: [sku, warehouse_id, event_ts]
  timestamp_column: event_ts
  numeric_ranges:
    quantity: {min: 0, max: 100000}
    reorder_level: {min: 0, max: 50000}
  allowed_values:
    unit: [PCS, KG, L]
  required_columns:
    - sku
    - warehouse_id
    - quantity
    - unit
    - event_ts

maintenance:
  key_columns: [ticket_id]
  timestamp_column: event_ts
  numeric_ranges:
    downtime_hours: {min: 0, max: 24}
  allowed_values:
    maintenance_type: [PREVENTIVE, CORRECTIVE, PREDICTIVE]
  required_columns:
    - ticket_id
    - machine_id
    - maintenance_type
    - downtime_hours
    - event_ts

quality:
  key_columns: [inspection_id]
  timestamp_column: event_ts
  numeric_ranges:
    defect_count: {min: 0, max: 500}
  allowed_values:
    result: [PASS, FAIL]
  required_columns:
    - inspection_id
    - batch_id
    - product_code
    - defect_count
    - result
    - event_ts
